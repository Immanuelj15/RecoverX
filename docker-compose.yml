version: '3.8'

services:
  ml-service:
    build: ./ml-service
    container_name: recoverx-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  backend:
    build: ./backend
    container_name: recoverx-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - ML_SERVICE_URL=http://ml-service:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - ml-service
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: recoverx-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
