<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2651"/>
      <stop offset="50%" stop-color="#14366F"/>
      <stop offset="100%" stop-color="#061329"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="50%" stop-color="#2D6CDF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primary-grad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Dynamic Shield / Recovery Arrow Loop -->
  <g transform="translate(0, 0)">
    <!-- Recovery Circular Spark Arrow -->
    <path d="M 256 100 A 156 156 0 1 1 120 210" fill="none" stroke="url(#primary-grad)" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Arrow Head pointing upward to success -->
    <path d="M 120 160 L 120 210 L 170 210" fill="none" stroke="url(#primary-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Glowing RecoverX Central "X" Symbol -->
    <path d="M 186 186 L 326 326" stroke="url(#primary-grad)" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 326 186 L 186 326" stroke="url(#accent-grad)" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Verified Central Success Spark Node -->
    <circle cx="256" cy="256" r="24" fill="#FFFFFF" filter="url(#glow)"/>
  </g>
</svg>
